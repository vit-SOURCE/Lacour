<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commander</title>
<meta name="theme-color" content="#0f766e">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#f2f5f4;--sf:#fff;--tx:#12262a;--mu:#5d7177;--bd:#d5dfdd;--ac:#0f766e;--acx:#fff;--bad:#b42318;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b1d;--sf:#16282b;--tx:#e6f0ee;--mu:#93a8ab;--bd:#2a4145;--ac:#2dd4bf;--acx:#06302b;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1b1d;--sf:#16282b;--tx:#e6f0ee;--mu:#93a8ab;--bd:#2a4145;--ac:#2dd4bf;--acx:#06302b;--bad:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:22px;margin:4px 0 2px}
h2{font-size:17px;margin:22px 0 8px}
.mu{color:var(--mu);font-size:14px}
.it{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:8px}
.q{display:flex;align-items:center;gap:10px}
.q button{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:20px;cursor:pointer}
.q b{min-width:20px;text-align:center}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px;width:100%}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin:16px 0 4px}
.send{display:block;text-align:center;text-decoration:none;background:var(--ac);color:var(--acx);padding:14px;border-radius:10px;font-weight:700;margin-top:14px}
.send.off{opacity:.55}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.warn{background:var(--sf);border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:12px;margin:12px 0}
details{margin-top:14px}.ok{background:var(--sf);border:2px solid var(--ac);border-radius:10px;padding:16px;margin-top:16px}.wa{display:block;text-align:center;text-decoration:none;border:1px solid var(--bd);color:var(--tx);padding:12px;border-radius:10px;margin-top:10px}.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
textarea{min-height:140px}
.lgchip{background:#fff;border-radius:12px;padding:6px 12px;display:inline-flex}.lgchip img{height:44px;display:block}.gh{font-size:15px;margin:16px 0 6px;color:var(--ac)}</style>
</head>
<body>
<main>

<h1 id="nm">Commander</h1>
<div class="mu">Choisissez vos plats et envoyez votre commande : le restaurant la reçoit tout de suite et vous rappelle pour la confirmer.</div>
<div id="warn"></div>
<h2>Menu</h2>
<div id="menu"><p class="mu">Chargement du menu…</p></div>
<div class="tot"><span>Total</span><span id="tot">0</span></div>
<h2>Vos informations</h2>
<label for="n">Nom</label><input id="n" autocomplete="name">
<label for="p">Téléphone</label><input id="p" type="tel" autocomplete="tel" inputmode="tel">
<label for="m">Mode de réception</label>
<select id="m"><option value="liv">Livraison</option><option value="ret">Retrait au restaurant</option></select>
<div id="af"><label for="a">Adresse de livraison</label><input id="a" autocomplete="street-address"></div>
<label for="x">Remarque (facultatif)</label><input id="x">
<div class="hp" aria-hidden="true"><label>Ne pas remplir</label><input id="site" tabindex="-1" autocomplete="off"></div>
<button class="send" id="go" type="button" style="width:100%;border:0;font:inherit;font-weight:700;cursor:pointer">Envoyer ma commande</button>
<div class="err" id="err"></div>
<div id="done"></div>
</main>
<script>
function grouped(c){var gs=c.groups||[];if(!gs.length)return c.menu;var out=[];gs.forEach(function(g){var it=c.menu.filter(function(m){return m.gid===g.id});if(it.length){out.push({h:g.name});it.forEach(function(m){out.push(m)})}});var rest=c.menu.filter(function(m){return!gs.some(function(g){return g.id===m.gid})});if(rest.length){out.push({h:"Autres"});rest.forEach(function(m){out.push(m)})}return out}
var CFG={name:"RESTAURANT LACOUR",cur:"FCFA",wa:"",menu:[]},q={};
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var fmt=function(n){return n.toLocaleString("fr-FR")+" "+CFG.cur};
var sum=function(){return CFG.menu.reduce(function(a,m){return a+m.price*(q[m.id]||0)},0)};
function upd(){$("tot").textContent=fmt(sum())}
fetch("/api/public").then(function(r){return r.json()}).then(function(c){
  CFG=c;if(c.logo&&$("lgp"))$("lgp").src=c.logo;document.title="Commander · "+c.name;$("nm").textContent=c.name;
  if(!c.menu.length){$("menu").innerHTML='<p class="mu">Le menu n’est pas encore disponible.</p>';return}
  $("menu").innerHTML=grouped(c).map(function(m){if(m.h)return '<h3 class="gh">'+esc(m.h)+'</h3>';return '<div class="it"><div><b>'+esc(m.name)+'</b><div class="mu">'+fmt(m.price)+'</div></div><div class="q"><button type="button" aria-label="Retirer" data-i="'+esc(m.id)+'" data-d="-1">−</button><b id="q_'+esc(m.id)+'">0</b><button type="button" aria-label="Ajouter" data-i="'+esc(m.id)+'" data-d="1">+</button></div></div>'}).join("");
  upd();
}).catch(function(){$("warn").innerHTML='<div class="warn">Impossible de charger le menu. Vérifiez votre connexion et actualisez la page.</div>'});
$("menu").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var i=b.dataset.i;q[i]=Math.max(0,(q[i]||0)+Number(b.dataset.d));$("q_"+i).textContent=q[i];upd()});
$("m").addEventListener("change",function(){$("af").style.display=$("m").value==="liv"?"":"none"});
function payload(){var liv=$("m").value==="liv";return{n:$("n").value.trim(),p:$("p").value.trim(),a:liv?$("a").value.trim():"",m:liv?"liv":"ret",x:$("x").value.trim(),site:$("site").value,i:CFG.menu.filter(function(m){return q[m.id]>0}).map(function(m){return[m.id,q[m.id]]})}}
$("go").addEventListener("click",function(){
  var d=payload(),err="";
  if(!d.i.length)err="Ajoutez au moins un article.";else if(!d.n)err="Indiquez votre nom.";else if(d.p.replace(/\D/g,"").length<8)err="Indiquez un numéro de téléphone valide.";else if(d.m==="liv"&&!d.a)err="Indiquez l’adresse de livraison.";
  $("err").textContent=err;if(err)return;
  var b=$("go");b.disabled=true;b.textContent="Envoi en cours…";
  fetch("/api/public/order",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(d)}).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})}).then(function(r){
    if(!r.ok){$("err").textContent=r.j.err||"Envoi impossible. Réessayez.";b.disabled=false;b.textContent="Envoyer ma commande";return}
    b.style.display="none";q={};
    $("done").innerHTML='<div class="ok"><b>Merci '+esc(d.n)+' ! Votre commande est envoyée.</b><p class="mu">Numéro de commande : '+esc(r.j.id)+'. Le restaurant vous appellera au '+esc(d.p)+' pour la confirmer.</p>'+(CFG.wa?'<a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+CFG.wa+'?text='+encodeURIComponent("Bonjour, je viens de passer la commande "+r.j.id+" au nom de "+d.n+".")+'">Écrire au restaurant sur WhatsApp</a>':"")+'</div>';
    window.scrollTo(0,document.body.scrollHeight);
  }).catch(function(){$("err").textContent="Envoi impossible. Vérifiez votre connexion.";b.disabled=false;b.textContent="Envoyer ma commande"});
});
</script>
</body>
</html>
