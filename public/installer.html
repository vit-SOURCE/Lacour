<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Installer l’application · RESTAURANT LACOUR</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#f2f5f4;--sf:#fff;--tx:#12262a;--mu:#4b5f64;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1b1d;--sf:#16282b;--tx:#e6f0ee;--mu:#93a8ab;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
main{width:100%;max-width:440px;text-align:center}
.ic{width:110px;height:110px;border-radius:24px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
h1{font-size:22px;margin:16px 0 4px}
.sub{color:var(--mu);margin:0 0 22px}
#pwa-landing{background:var(--sf);border-radius:16px;padding:18px;text-align:left;display:flex;gap:12px;color:var(--tx);border:1px solid rgba(128,128,128,.25)}
#pwa-landing img{display:none}
#pwa-landing [data-d]{color:var(--mu)!important}
</style>
</head>
<body>
<main>
<img class="ic" src="icons/icon-512.png" alt="LaCour">
<h1>RESTAURANT LACOUR</h1>
<p class="sub">Installez l’application sur votre téléphone en quelques secondes.</p>
<div id="pwa-landing"><div style="flex:1"><div data-t style="font-weight:700;margin-bottom:4px"></div><div data-d style="font-size:15px;margin-bottom:12px"></div><div data-act style="display:flex;gap:8px;flex-wrap:wrap"></div></div></div>
</main>
<script>window.PWA_LANDING=true;</script>
<script src="install.js"></script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script>
</body>
</html>
