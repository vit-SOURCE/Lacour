<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RESTAURANT LACOUR</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LaCour">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f4;--sf:#fff;--tx:#12262a;--mu:#5d7177;--bd:#d5dfdd;--ac:#0f766e;--acx:#fff;--ok:#167a3d;--wn:#b45309;--bd2:#b42318;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b1d;--sf:#16282b;--tx:#e6f0ee;--mu:#93a8ab;--bd:#2a4145;--ac:#2dd4bf;--acx:#06302b;--ok:#4ade80;--wn:#fbbf24;--bd2:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1b1d;--sf:#16282b;--tx:#e6f0ee;--mu:#93a8ab;--bd:#2a4145;--ac:#2dd4bf;--acx:#06302b;--ok:#4ade80;--wn:#fbbf24;--bd2:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
header{flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 6px;max-width:1100px;margin:0 auto}
h1{font-size:20px;margin:0;font-weight:700}
h2{font-size:18px;margin:0}
#sub{color:var(--mu);font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 16px 10px;max-width:1100px;margin:0 auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:8px 14px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
nav i{font-style:normal;margin-left:6px;background:var(--bd2);color:#fff;border-radius:999px;padding:0 7px;font-size:12px}
main{max-width:1100px;margin:0 auto;padding:6px 16px 40px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 14px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.busy{border-left:5px solid var(--bd2)}
.card.free{border-left:5px solid var(--ok)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.g{justify-content:flex-start;flex-wrap:wrap}
.mu{color:var(--mu);font-size:13px}
.b{border:0;background:var(--ac);color:var(--acx);padding:9px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.b.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.b.d{background:var(--bd2);color:#fff}
.b.s{padding:6px 10px;font-size:13px}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid currentColor}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bd2)}.tag.wn{color:var(--wn)}.tag.ac{color:var(--ac)}
table{width:100%;border-collapse:collapse;background:var(--sf);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--bd);font-size:14px}
th{color:var(--mu);font-weight:600;font-size:13px}
.sc{overflow-x:auto;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.st{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px}
.st b{display:block;font-size:20px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:20}
.box{background:var(--sf);border-radius:12px;padding:18px;width:100%;max-width:520px}
.it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd)}
.it input{width:70px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;display:none}
.empty{color:var(--mu);padding:24px 0}.lgchip{background:#fff;border-radius:10px;padding:4px 10px;display:inline-flex;flex:none;align-items:center}.lgchip img{height:34px;max-width:150px;object-fit:contain;display:block}.gh{font-size:15px;margin:16px 0 6px}.cbox{border:2px solid var(--ac);border-radius:10px;padding:4px 12px 12px;margin-top:12px}.cbox>b{display:block;margin-top:8px;color:var(--ac)}hr{border:0;border-top:1px solid var(--bd);margin:16px 0}.star{color:var(--wn);letter-spacing:2px}nav button.hl{border:2px solid var(--ac)}#ban:not(:empty){max-width:1100px;margin:6px auto;padding:10px 14px;border:2px solid var(--wn);border-radius:8px;background:var(--sf);color:var(--tx);font-size:14px}.av{border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;background:var(--ac);color:var(--acx);font-weight:700;flex:none}.pick{font:inherit;color:var(--tx);cursor:pointer;align-items:center;text-align:center}
.inv h2{margin-bottom:2px}
.tot{font-weight:700;font-size:17px}
@media print{body *{visibility:hidden}.printing,.printing *{visibility:visible}.printing{position:absolute;left:0;top:0;width:100%;color:#000;background:#fff}.noprint{display:none!important}}
</style>
</head>

<nav id="nav"></nav>
<div id="ban"></div>
<main id="main"></main>

const KEY="resto-gestion-v1";
function uid(){return Math.random().toString(36).slice(2,9)}
const DEFT="Bonjour {client}, merci d’avoir choisi {restaurant} ! Votre facture {facture} de {total} est bien réglée. Votre avis compte pour nous : sur une note de 1 (décevant) à 5 (excellent), comment avez-vous trouvé votre expérience ? Répondez simplement à ce message. À très bientôt !";
let S={set:{name:"RESTAURANT LACOUR",cur:"FCFA",tva:0,cc:"229",thanks:DEFT,orderUrl:location.origin+"/commande.html",wa:"",wa2:""},tables:[],stock:[],menu:[],clients:[],staff:[],orders:[],expenses:[],roles:[],groups:[]};
let OLD=null;try{const r=localStorage.getItem(KEY);if(r)OLD=JSON.parse(r)}catch(e){}
let DB=null,USR=null,hrOK=false,loading=!!(window.claude&&window.claude.use),rt=0,lastSet=null;
const COLS=["tables","stock","menu","clients","orders","expenses","roles","groups"],TK=["id","nom","prenoms","role","photo","pinh","emh","etat"],HK=["id","contact","adresse","cnss","email"];
const last={tables:{},stock:{},menu:{},clients:{},orders:{},expenses:{},roles:{},groups:{},team:{},hr:{}},wq={};
const J=v=>v&&typeof v==="object"?Array.isArray(v)?"["+v.map(J).join()+"]":"{"+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+":"+J(v[k])).join()+"}":JSON.stringify(v);
const cl=o=>JSON.parse(JSON.stringify(o));
const pick=(o,k)=>{const r={};k.forEach(x=>r[x]=o[x]==null?"":o[x]);return r};
function wr(path,fn){wq[path]=(wq[path]||Promise.resolve()).then(fn).catch(e=>{toast("Enregistrement impossible"+(e&&e.code?" ("+e.code+")":"")+".")})}
function push(c,list,m){const seen={};
list.forEach(raw=>{const o=cl(raw),p=m[o.id],path=c+"/"+o.id;seen[o.id]=1;
if(!p){m[o.id]=o;wr(path,()=>DB.doc(path).set(o))}
else{const ch={};let n=0;Object.keys(o).forEach(k=>{if(J(o[k])!==J(p[k])){ch[k]=o[k];n++}});
if(n){m[o.id]=o;wr(path,()=>DB.doc(path).update(ch).catch(()=>DB.doc(path).set(o)))}}});
Object.keys(m).forEach(id=>{if(!seen[id]){delete m[id];wr(c+"/"+id,()=>DB.doc(c+"/"+id).delete())}})}
function sync(){if(!DB){if(!loading){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}return}if(loading)return;
COLS.forEach(c=>push(c,S[c],last[c]));
push("team",S.staff.map(p=>pick(p,TK)),last.team);
if(hrOK){push("hr",S.staff.map(p=>pick(p,HK)),last.hr);
const o=cl(S.set);if(!lastSet||J(o)!==J(lastSet)){lastSet=o;wr("meta/set",()=>DB.doc("meta/set").set(o))}}}
async function hpin(id,p){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("resto:"+id+":"+p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return"p:"+id+":"+p}}
const sq=s=>{let q=s.qty;S.orders.forEach(o=>{if(o.status!=="Annulée"&&o.at>=(s.since||0))o.items.forEach(i=>{if(i.sid===s.id)q-=i.use*i.qty})});return Math.round(q*1000)/1000};
async function nextInv(){if(!DB){S.set.next=(S.set.next||0)+1;return S.set.next}
const ref=DB.doc("meta/counter");
for(let i=0;i<8;i++){try{const r=await ref.acquire({holder:cur||"x",ttlMs:2000});if(r.acquired){const sn=await ref.get(),n=(sn.exists?sn.data().n:0)+1;await ref.set({n:n});return n}}catch(e){}

return Date.now()%100000}

function listen(done){const first={},g=k=>{if(!first[k]){first[k]=1;done()}},er=k=>e=>{g(k);if(e&&e.code==="revoked")ban("Votre accès a été retiré.")};
COLS.forEach(c=>DB.collection(c).onSnapshot(sn=>{const a=[];last[c]={};sn.docs.forEach(d=>{const x=cl(d.data());a.push(x);last[c][d.id]=cl(x)});if(c!=="orders")a.sort((x,y)=>(x.name||"").localeCompare(y.name||"","fr",{numeric:true}));S[c]=a;g(c);later()},er(c)));
let T={},H={};const mix=()=>{S.staff=Object.keys(T).sort().map(id=>Object.assign({},T[id],H[id]||{}))};
DB.collection("team").onSnapshot(sn=>{T={};last.team={};sn.docs.forEach(d=>{T[d.id]=cl(d.data());last.team[d.id]=cl(pick(d.data(),TK))});mix();g("team");later()},er("team"));
DB.collection("hr").onSnapshot(sn=>{H={};last.hr={};sn.docs.forEach(d=>{H[d.id]=cl(d.data());last.hr[d.id]=cl(pick(d.data(),HK))});mix();g("hr");later()},er("hr"));
DB.doc("meta/set").onSnapshot(sn=>{if(sn.exists)Object.assign(S.set,sn.data());lastSet=cl(S.set);g("set");later()},er("set"))}
function localInit(){if(!OLD)return;COLS.forEach(c=>{S[c]=(OLD[c]||[]).map(cl)});S.staff=(OLD.staff||[]).map(cl);S.set=Object.assign(S.set,OLD.set||{})}
